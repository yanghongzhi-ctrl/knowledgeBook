<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-labelledby="title desc">
  <title id="title">CDE协同交付示意</title>
  <desc id="desc">展示道路BIM正向设计成果在共同数据环境中进行提交、校核、批准和归档的协同交付流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <linearGradient id="cdeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1672" height="941" fill="#f8fafc"/>
  <text x="836" y="72" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="700" fill="#0f172a">CDE协同交付示意</text>
  <text x="836" y="118" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#475569">以共同数据环境组织模型、图纸、属性和审查意见，形成可追溯的交付闭环</text>

  <rect x="546" y="206" width="580" height="360" rx="34" fill="url(#cdeGrad)" stroke="#60a5fa" stroke-width="3" filter="url(#softShadow)"/>
  <text x="836" y="270" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34" font-weight="700" fill="#1d4ed8">共同数据环境 CDE</text>
  <text x="836" y="315" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#334155">统一版本 · 权限控制 · 审查留痕 · 成果归档</text>

  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <rect x="606" y="356" width="160" height="78" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="686" y="389" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">模型成果</text>
    <text x="686" y="418" text-anchor="middle" font-size="17" fill="#64748b">BIM / GIS</text>

    <rect x="756" y="456" width="160" height="78" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="836" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">审查意见</text>
    <text x="836" y="518" text-anchor="middle" font-size="17" fill="#64748b">问题单 / 批注</text>

    <rect x="906" y="356" width="160" height="78" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="986" y="389" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">交付包</text>
    <text x="986" y="418" text-anchor="middle" font-size="17" fill="#64748b">图纸 / 属性</text>
  </g>

  <g font-family="Microsoft YaHei, SimHei, sans-serif" filter="url(#softShadow)">
    <rect x="106" y="214" width="292" height="116" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="252" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">设计单位</text>
    <text x="252" y="296" text-anchor="middle" font-size="19" fill="#64748b">提交模型与交付文件</text>

    <rect x="1274" y="214" width="292" height="116" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1420" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">审查单位</text>
    <text x="1420" y="296" text-anchor="middle" font-size="19" fill="#64748b">校核规则与问题反馈</text>

    <rect x="106" y="524" width="292" height="116" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="252" y="570" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">施工单位</text>
    <text x="252" y="606" text-anchor="middle" font-size="19" fill="#64748b">接收批准成果并应用</text>

    <rect x="1274" y="524" width="292" height="116" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1420" y="570" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">业主/运维</text>
    <text x="1420" y="606" text-anchor="middle" font-size="19" fill="#64748b">验收、归档与运维移交</text>
  </g>

  <g fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)">
    <path d="M398 272 C456 272 488 286 536 320"/>
    <path d="M1126 320 C1178 284 1214 272 1274 272"/>
    <path d="M398 582 C458 574 492 544 546 500"/>
    <path d="M1126 500 C1184 544 1218 574 1274 582"/>
  </g>

  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <rect x="238" y="752" width="1196" height="92" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="312" y="808" font-size="24" font-weight="700" fill="#0f172a">交付闭环</text>
    <text x="500" y="808" font-size="22" fill="#334155">提交</text>
    <text x="654" y="808" font-size="22" fill="#334155">版本校核</text>
    <text x="846" y="808" font-size="22" fill="#334155">协同审查</text>
    <text x="1040" y="808" font-size="22" fill="#334155">批准发布</text>
    <text x="1240" y="808" font-size="22" fill="#334155">归档移交</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M560 800 L630 800"/>
    <path d="M760 800 L830 800"/>
    <path d="M952 800 L1024 800"/>
    <path d="M1158 800 L1228 800"/>
  </g>
</svg>
