<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-labelledby="title desc">
  <title id="title">LOD与LOI阶段适配示意</title>
  <desc id="desc">展示道路BIM正向设计中几何精度LOD与信息完整度LOI随设计、施工和运维阶段逐步提高的适配关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <linearGradient id="lod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="loi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1672" height="941" fill="#f8fafc"/>
  <text x="836" y="72" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="700" fill="#0f172a">LOD与LOI阶段适配示意</text>
  <text x="836" y="118" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#475569">几何表达精度与属性信息完整度，需要随项目阶段和模型用途同步提高</text>

  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <rect x="168" y="190" width="1336" height="570" rx="28" fill="#ffffff" stroke="#cbd5e1" filter="url(#softShadow)"/>
    <line x1="326" y1="232" x2="326" y2="708" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="574" y1="232" x2="574" y2="708" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="822" y1="232" x2="822" y2="708" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="1070" y1="232" x2="1070" y2="708" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="1318" y1="232" x2="1318" y2="708" stroke="#e2e8f0" stroke-width="2"/>

    <text x="450" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">方案阶段</text>
    <text x="698" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">初步设计</text>
    <text x="946" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">施工图设计</text>
    <text x="1194" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">施工建造</text>
    <text x="1412" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">运维移交</text>

    <text x="252" y="376" text-anchor="middle" font-size="27" font-weight="700" fill="#1d4ed8">LOD</text>
    <text x="252" y="408" text-anchor="middle" font-size="18" fill="#64748b">几何精度</text>
    <path d="M386 392 C560 376 704 356 846 336 C1040 296 1224 270 1448 252" fill="none" stroke="url(#lod)" stroke-width="22" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="450" y="452" text-anchor="middle" font-size="19" fill="#334155">总体走廊</text>
    <text x="698" y="432" text-anchor="middle" font-size="19" fill="#334155">主要构件</text>
    <text x="946" y="400" text-anchor="middle" font-size="19" fill="#334155">精确尺寸</text>
    <text x="1194" y="366" text-anchor="middle" font-size="19" fill="#334155">施工细部</text>
    <text x="1412" y="330" text-anchor="middle" font-size="19" fill="#334155">实景一致</text>

    <text x="252" y="586" text-anchor="middle" font-size="27" font-weight="700" fill="#15803d">LOI</text>
    <text x="252" y="618" text-anchor="middle" font-size="18" fill="#64748b">信息完整度</text>
    <path d="M386 610 C560 596 704 570 846 542 C1042 502 1224 454 1448 398" fill="none" stroke="url(#loi)" stroke-width="22" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="450" y="670" text-anchor="middle" font-size="19" fill="#334155">分类编码</text>
    <text x="698" y="646" text-anchor="middle" font-size="19" fill="#334155">设计参数</text>
    <text x="946" y="614" text-anchor="middle" font-size="19" fill="#334155">材料与工程量</text>
    <text x="1194" y="570" text-anchor="middle" font-size="19" fill="#334155">进度与质量</text>
    <text x="1412" y="522" text-anchor="middle" font-size="19" fill="#334155">资产与养护</text>
  </g>

  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <rect x="254" y="812" width="1164" height="76" rx="20" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="314" y="860" font-size="23" font-weight="700" fill="#1e1b4b">使用原则</text>
    <text x="472" y="860" font-size="21" fill="#334155">LOD回答“模型画到多细”，LOI回答“信息填到多全”；两者共同服务设计审查、施工应用和运维交付。</text>
  </g>
</svg>
