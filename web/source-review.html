<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>第10、11章证据边界复核</title>
    <link rel="stylesheet" href="./source-review.css?v=20260605b" />
  </head>
  <body>
    <main class="review-shell">
      <aside class="rail">
        <div class="brand">
          <strong>证据边界复核</strong>
          <span>第10、11章 Source_Chunks</span>
        </div>

        <section class="panel">
          <h2>筛选</h2>
          <label>
            章节
            <select id="chapterFilter">
              <option value="">全部</option>
              <option value="ch10">第10章</option>
              <option value="ch11">第11章</option>
            </select>
          </label>
          <label>
            优先级
            <select id="priorityFilter">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            建议决策
            <select id="decisionFilter">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            关键词
            <input id="searchInput" type="search" placeholder="chunk、片段或候选段落" />
          </label>
        </section>

        <section class="panel">
          <h2>统计</h2>
          <div id="summary" class="summary"></div>
        </section>

        <section class="panel">
          <h2>条目</h2>
          <div id="itemList" class="item-list"></div>
        </section>
      </aside>

      <section class="detail">
        <header class="topbar">
          <div>
            <h1 id="detailTitle">加载中</h1>
            <p id="detailMeta">读取复核数据...</p>
          </div>
          <div class="actions">
            <label class="file-action">
              导入审批 JSON
              <input id="approvalFile" type="file" accept="application/json,.json" />
            </label>
            <button id="loadDraft" type="button">加载草稿</button>
            <button id="saveDraft" type="button">保存草稿</button>
            <button id="copyJson" type="button">复制审批 JSON</button>
            <button id="downloadJson" type="button">下载审批 JSON</button>
            <button id="downloadFilledJson" type="button">只下载已填写</button>
            <button id="applySuggested" type="button">填入当前建议</button>
            <button id="clearFiltered" type="button">清空当前填写</button>
          </div>
        </header>
        <div id="validationStatus" class="validation-status">尚未填写审批决策。</div>

        <div class="comparison">
          <article class="text-panel">
            <h2>Source_Chunk</h2>
            <pre id="sourceText"></pre>
          </article>
          <article class="text-panel">
            <h2>候选 Word 段落</h2>
            <pre id="candidateText"></pre>
          </article>
        </div>

        <section class="decision-panel">
          <h2>审批填写</h2>
          <div class="decision-grid">
            <label>
              decision
              <select id="decisionInput">
                <option value="">保持待复核</option>
                <option value="confirm_candidate_anchor">确认候选锚点</option>
                <option value="confirm_teaching_summary">确认教学摘要</option>
                <option value="confirm_boundary_fragment">确认边界片段</option>
                <option value="split_required">需要拆分</option>
                <option value="reject_candidate">拒绝候选</option>
                <option value="manual_anchor_pending">继续人工查找锚点</option>
              </select>
            </label>
            <label>
              reviewer_notes
              <textarea id="notesInput" rows="4" placeholder="记录判断依据、需补上下文或需拆分原因"></textarea>
            </label>
          </div>
          <dl id="evidenceFacts" class="facts"></dl>
        </section>
      </section>
    </main>

    <script src="./source-review.js?v=20260605b"></script>
  </body>
</html>
